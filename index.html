<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />

    <!-- Favicon & ikon PWA -->
    <link rel="icon" type="image/png" href="./favicon-32.png" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />

    <!-- Web App Manifest — mengaktifkan fitur Install/Add to Home Screen -->
    <link rel="manifest" href="./manifest.json" />
    <meta name="theme-color" content="#1C3661" />

    <!-- Supaya saat dibuka dari Home Screen tampil "standalone" (tanpa UI
         browser) di iOS Safari juga — iOS belum membaca manifest.json
         untuk hal ini, harus lewat meta tag khusus Apple. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="SI-Tekhum" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>SI-Tekhum — Sistem Informasi Teknis dan Hukum KPU Kabupaten</title>
    <meta
      name="description"
      content="SI-Tekhum: portal internal Kinerja, Teknis, Hukum, dan Pleno Subbagian Teknis dan Hukum KPU Kabupaten."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="bg-slate-50">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
